# Load balancer for Rinha de Backend 2026.
# Pure round-robin reverse proxy — no business logic, no payload inspection.
# Accepts on 9999 (the contract port) and forwards to the two API instances.

worker_processes 1;

events {
    worker_connections 4096;
}

http {
    access_log off;
    error_log /dev/stderr error;

    # Keep upstream connections warm to avoid per-request TCP/handshake cost.
    upstream api {
        server api1:8080;
        server api2:8080;
        keepalive 128;
    }

    server {
        listen 9999 backlog=1024;

        location / {
            proxy_pass http://api;

            # Required for upstream keepalive to take effect.
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;

            # Stay just under k6's 2001ms request timeout so a slow upstream
            # surfaces as a fast 5xx rather than hanging the client.
            proxy_connect_timeout 1s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;

            proxy_buffering off;
        }
    }
}
