# Rinha de Backend 2026 — deployable stack (FD-passing load balancer + 2 APIs).
#
# Topology (docs/ARCHITECTURE.md): a purpose-built Rust load balancer (lb) owns
# the contract port :9999, accepts every client connection, and hands the
# accepted client socket file descriptor to one of the two API instances over a
# persistent Unix control socket via SCM_RIGHTS. The API serves the response
# directly on that fd — the balancer is OFF the data path (no HTTP proxying).
#
# The control sockets live on a shared volume (/sockets) mounted into all three
# containers. Total resource limits across ALL services are capped at 1.0 CPU
# and 350MB:
#
#     lb     0.075 CPU /  16MB
#     api1   0.4625 CPU / 167MB
#     api2   0.4625 CPU / 167MB
#     -----  -----------------
#     total  1.00 CPU / 350MB
#
# Network mode is bridge (host mode is forbidden). FD passing works across
# containers because SCM_RIGHTS duplicates the fd into the receiving process on
# the same host kernel; the control socket is reachable through the shared
# volume. The API image bakes in the pre-built references.bin.
#
# Build for the evaluation box explicitly with: docker compose build (add
# `--platform linux/amd64` when building from a non-amd64 host).

services:
  api1:
    build:
      context: .
      dockerfile: Dockerfile
    image: rinha-2026-api:latest
    environment:
      FD_SOCKET: "/sockets/api1.sock"
      READY_FILE: "/tmp/rinha-ready"
      SCORER: "${SCORER:-ivf}"
      NPROBE: "${NPROBE:-6}"
      MAX_NPROBE: "${MAX_NPROBE:-24}"
      WORKERS: "${WORKERS:-1}"
    volumes:
      - sockets:/sockets
    networks:
      - rinha-net
    deploy:
      resources:
        limits:
          cpus: "0.4625"
          memory: "167MB"

  api2:
    image: rinha-2026-api:latest
    depends_on:
      - api1
    environment:
      FD_SOCKET: "/sockets/api2.sock"
      READY_FILE: "/tmp/rinha-ready"
      SCORER: "${SCORER:-ivf}"
      NPROBE: "${NPROBE:-6}"
      MAX_NPROBE: "${MAX_NPROBE:-24}"
      WORKERS: "${WORKERS:-1}"
    volumes:
      - sockets:/sockets
    networks:
      - rinha-net
    deploy:
      resources:
        limits:
          cpus: "0.4625"
          memory: "167MB"

  lb:
    build:
      context: ./lb
      dockerfile: Dockerfile
    image: rinha-2026-lb:latest
    environment:
      LB_LISTEN: "0.0.0.0:9999"
      FD_UPSTREAMS: "/sockets/api1.sock,/sockets/api2.sock"
    volumes:
      - sockets:/sockets
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    networks:
      - rinha-net
    deploy:
      resources:
        limits:
          cpus: "0.075"
          memory: "16MB"

networks:
  rinha-net:
    name: rinha-net
    driver: bridge

volumes:
  sockets:
