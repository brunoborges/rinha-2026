# Rinha de Backend 2026 — deployable stack (load balancer + 2 API instances).
#
# Topology (docs/ARCHITECTURE.md): nginx round-robins to api1/api2; the LB does
# no business logic. Total resource limits across ALL services are capped at
# 1.0 CPU and 350MB:
#
#     nginx  0.10 CPU /  20MB
#     api1   0.45 CPU / 165MB
#     api2   0.45 CPU / 165MB
#     -----  ----------------
#     total  1.00 CPU / 350MB
#
# Network mode is bridge (host mode is forbidden). The API image bakes in the
# pre-built references.bin, so startup is just an mmap + warmup (no JSON parse).
#
# NOTE: no `platform:` is pinned so it builds NATIVELY on the host (fast arm64
# locally; native amd64 on the linux/amd64 evaluation box). Build for amd64
# explicitly with:  docker compose build --build-arg ... / `--platform linux/amd64`.

services:
  api1:
    build:
      context: .
      dockerfile: Dockerfile
    image: rinha-2026-api:latest
    environment:
      PORT: "8080"
      SCORER: "${SCORER:-ivf}"
      NPROBE: "${NPROBE:-8}"
      WORKERS: "${WORKERS:-4}"
    networks:
      - rinha-net
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"

  api2:
    image: rinha-2026-api:latest
    depends_on:
      - api1
    environment:
      PORT: "8080"
      SCORER: "${SCORER:-ivf}"
      NPROBE: "${NPROBE:-8}"
      WORKERS: "${WORKERS:-4}"
    networks:
      - rinha-net
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    networks:
      - rinha-net
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "20MB"

networks:
  rinha-net:
    name: rinha-net
    driver: bridge
